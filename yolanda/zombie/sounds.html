<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sound Board</title>
<style>
  :root { --bg:#1b2328; --panel:#24303a; --panel2:#2b3944; --ink:#eef2f0; --dim:#9db0ad; --teal:#2fb1b4; --amber:#ffb347; --red:#ff6b5e; --green:#66d18f; --line:#3a4a52; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:500 13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  button, select, input[type=text], input[type=search], textarea { font:inherit; color:var(--ink); background:#33434c; border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; touch-action:manipulation; } button:hover { background:#3d505a; } button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--teal); border-color:var(--teal); color:#06201f; font-weight:700; }
  button.big { padding:9px 14px; font-size:14px; }
  input[type=range] { accent-color:var(--teal); }
  h1 { font-size:16px; margin:0; } h2 { font-size:16px; margin:0; } h3 { margin:0; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.07em; }
  #top { position:sticky; top:0; z-index:5; background:var(--bg); box-shadow:0 4px 12px rgba(0,0,0,.35); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  #top .grp { display:flex; gap:8px; align-items:center; }
  #top label { display:flex; gap:6px; align-items:center; color:var(--dim); white-space:nowrap; }
  #top input[type=range] { width:100px; }
  #status { color:var(--dim); font-variant-numeric:tabular-nums; }
  #prog { color:var(--dim); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:8px; }
  #saveState { color:var(--dim); min-width:90px; } #saveState.dirty { color:var(--amber); } #saveState.ok { color:var(--green); }
  #stop { font-weight:700; } #stop.live { background:var(--red); border-color:var(--red); color:#2a0b08; }
  .bar { display:inline-block; width:70px; height:6px; border-radius:3px; background:#33434c; overflow:hidden; vertical-align:middle; }
  .bar i { display:block; height:100%; background:var(--teal); }
  #wrap { display:flex; gap:16px; padding:16px; align-items:flex-start; }
  #side { width:270px; flex:none; position:sticky; top:76px; max-height:calc(100vh - 92px); overflow:auto; padding-right:4px; }
  #side input[type=search] { width:100%; margin-bottom:8px; }
  details.grp { margin-bottom:8px; }
  details.grp > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:6px 4px; color:var(--ink); font-size:13px; }
  details.grp > summary::before { content:'▸'; color:var(--dim); } details.grp[open] > summary::before { content:'▾'; }
  details.grp > summary b { flex:1; } .gp { color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; }
  #side h4 { margin:8px 0 2px 6px; font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.07em; }
  .snd { display:block; width:100%; text-align:left; margin:3px 0; background:var(--panel); padding:7px 10px; }
  .snd.cur { background:#1f5d60; border-color:var(--teal); }
  .snd small { display:block; color:var(--dim); font-size:11px; }
  #mob { display:none; }
  #main { flex:1; min-width:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .crumb { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.07em; margin-bottom:4px; }
  .hd { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
  .hd .sp { flex:1; }
  .trim { display:flex; gap:6px; align-items:center; color:var(--dim); font-variant-numeric:tabular-nums; }
  .trim input { width:110px; } .trim b { color:var(--ink); min-width:52px; text-align:right; font-weight:600; }
  textarea { width:100%; min-height:38px; margin-top:8px; resize:vertical; }
  .help { color:var(--dim); font-size:12px; margin-top:6px; }
  .help.hook { color:#bff3f1; margin:8px 0 0; }
  .help.pend { color:#ffd99a; margin:8px 0 0; }
  .take { display:grid; grid-template-columns:auto 220px 1fr auto; gap:8px 10px; align-items:center; padding:7px 8px; border-radius:9px; border:1px solid transparent; }
  .take:nth-child(odd) { background:rgba(255,255,255,.025); }
  .take:focus { outline:none; border-color:var(--teal); }
  .take.now { border-color:var(--amber); background:rgba(255,179,71,.08); }
  .wv { position:relative; }
  .take canvas { width:220px; height:34px; background:#1a2329; border-radius:6px; cursor:pointer; display:block; }
  .ph { position:absolute; top:0; bottom:0; width:2px; background:#fff; opacity:0; pointer-events:none; left:0; }
  .take .nm { min-width:0; } .take .nm div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip { display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:6px; margin-right:6px; }
  .chip.in { background:#1f5d60; color:#bff3f1; } .chip.cand { background:#4a3c22; color:#ffd99a; } .chip.out { background:#5a2a27; color:#ffc2bb; } .chip.later { background:#3d2f5c; color:#e2d0ff; }
  .len { color:var(--dim); font-size:11px; margin-right:6px; font-variant-numeric:tabular-nums; }
  .vd { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:330px; }
  .vd button { min-width:40px; padding:6px 9px; white-space:nowrap; }
  .vd .yes { color:var(--green); border-color:#3f7a57; } .vd .no { color:var(--red); border-color:#7a3f3a; } .vd .lat { color:#d9c2ff; border-color:#5b4a80; }
  .play { width:40px; height:34px; padding:0; font-size:15px; }
  .lyr { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .lyr .hd h3 { color:var(--amber); font-size:12px; cursor:pointer; user-select:none; }
  .lyr.off .takes { opacity:.4; } .lyr.shut .takes { display:none; }
  .bulk { color:var(--dim); font-size:12px; display:flex; gap:5px; align-items:center; } .bulk button { padding:3px 8px; font-size:12px; }
  .snd .todo { color:var(--amber); font-weight:600; }
  .prog1 { color:var(--dim); font-variant-numeric:tabular-nums; }
  button.next { border-color:var(--amber); color:var(--amber); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .tab { padding:5px 11px; border-radius:20px; } .tab span { color:var(--dim); margin-left:3px; }
  .tab.on { background:var(--teal); border-color:var(--teal); color:#06201f; font-weight:700; } .tab.on span { color:#06201f; }
  .use { color:var(--dim); font-size:11.5px; margin-top:2px; } .use.also { color:#ffd99a; }
  .from { color:var(--dim); font-size:11.5px; }
  .later { display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; } .later select { min-width:190px; } .later input { flex:1; min-width:120px; }
  .take.k-out canvas, .take.k-out .lbl { opacity:.45; }
  .take.k-review-in, .take.k-review-new { box-shadow:inset 3px 0 0 var(--amber); }
  .flash { animation:fl .35s; } @keyframes fl { from { background:#2f6e70; } }
  .keys { color:var(--dim); font-size:11.5px; padding:4px 2px 0; } .keys b { color:var(--ink); font-weight:600; background:#33434c; border-radius:4px; padding:0 5px; }
  @media (max-width: 760px) {
    #wrap { flex-direction:column; padding:10px 12px; }
    #side { display:none; }
    #mob { display:flex; flex-wrap:wrap; gap:6px; width:100%; }
    #mob select { flex:1; min-width:0; } #mob input { width:100%; }
    .take { grid-template-columns:auto 1fr; }
    .take .wv { grid-column:1 / -1; order:-1; } .take canvas { width:100%; }
    .take .vd { grid-column:1 / -1; max-width:none; justify-content:flex-start; } .vd button { flex:1 0 auto; }
    #top { padding:8px 12px; gap:8px 12px; }
    .keys { display:none; }
  }
</style>
</head>
<body>
<div id="top">
  <h1>Sound Board</h1>
  <span id="status">loading…</span>
  <span id="prog"></span>
  <div class="grp">
    <label><input type="checkbox" id="phone"> Phone speaker</label>
    <label><input type="checkbox" id="room" checked> Room reverb</label>
  </div>
  <div class="grp">
    <label>Left/right <input type="range" id="pan" min="-0.85" max="0.85" step="0.05" value="0"></label>
    <label>Distance <input type="range" id="dist" min="0" max="20" step="0.5" value="0"> <span id="distV">0 m</span></label>
  </div>
  <label>Volume <input type="range" id="vol" min="0" max="1" step="0.05" value="0.9"></label>
  <div class="grp" style="margin-left:auto">
    <button id="stop" title="Stop every sound (Esc)">■ Stop</button>
    <button id="undo" title="Undo the last change (Ctrl+Z)">↶ Undo</button>
    <label title="Save each change by itself, a moment after you make it"><input type="checkbox" id="autosave" checked> Autosave</label>
    <span id="saveState">saved</span>
    <button id="save" class="primary">Save choices</button>
  </div>
</div>
<div id="wrap">
  <div id="side">
    <input type="search" id="q" placeholder="Search sounds and takes ( / )">
    <div id="list"></div>
    <div class="keys"><b>Space</b> play in game · <b>A</b> audition the rest · <b>N</b> next to review · <b>Esc</b> stop · <b>[ ]</b> previous / next sound · <b>Ctrl+Z</b> undo<br>On a take: <b>Enter</b> play · <b>M</b> in mix · <b>K</b> keep/add · <b>L</b> later · <b>R</b> reject · <b>U</b> undo</div>
  </div>
  <div id="mob">
    <button id="prev" title="Previous sound">◀</button><select id="pick"></select><button id="next" title="Next sound">▶</button>
    <input type="search" id="q2" placeholder="Search sounds and takes">
  </div>
  <div id="main"></div>
</div>
<script type="module" src="src/soundboard.js"></script>
</body>
</html>
